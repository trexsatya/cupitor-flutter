name: cupitor
description: "A contextual dictionary app for reading."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.184+184

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.2.1
  shared_preferences: ^2.2.2
  http: ^1.2.0
  pdfrx: ^1.0.0
  # AudioBridge persists manual-entry recordings via the host app: JS in
  # dialog1's WebView sends base64 audio, Flutter writes it under
  # <docs>/manual_audio/<id>.<ext>, JS holds the resulting file:// URL.
  path_provider: ^2.1.0
  wakelock_plus: ^1.1.0
  speech_to_text: ^7.0.0
  google_mlkit_translation: ^0.13.1
  # Bridge for window.speechSynthesis inside dialog1 — Android WebView does not
  # implement the Web Speech Synthesis API natively, so the dictionary page's
  # TTS calls would otherwise no-op. macOS WKWebView supports it natively, but
  # we route through this on every platform for behavior parity.
  flutter_tts: ^4.2.0
  # EPUB reader stack:
  #   archive    — unzip the .epub container (EPUB is a renamed zip).
  #   xml        — parse container.xml / OPF (manifest+spine) / NCX/nav (TOC).
  #   crypto     — SHA-1 of file bytes → resume-state key (survives a rename).
  #   file_picker — device-storage source for "Open EPUB" in the Tools sheet.
  archive: ^3.4.0
  xml: ^6.5.0
  crypto: ^3.0.3
  file_picker: ^8.0.0
  # Sentence-tagging feature uses SQLite for the first time in Cupitor.
  # Schema bootstrapped in lib/db.dart; existing prefs/JSON storage is
  # untouched — a separate spec covers the eventual full migration.
  sqflite: ^2.3.0
  # Open URL attachments (image / audio / video / arbitrary link) in the
  # user's chosen external handler — the app itself only shows them as
  # metadata rows and delegates playback to the OS.
  url_launcher: ^6.2.5
  # In-Dart image decoding + encoding for the tag-capture sheet's
  # compression option (resize + JPEG re-encode at chosen quality).
  # Runs in a background isolate via compute() — no dart:ui coupling.
  # Pinned to <4.9 because 4.9+ requires xml ^7 and we still use xml ^6
  # (EPUB parser). Bumping xml here would cascade through the EPUB
  # code — out of scope for this feature.
  image: '>=4.3.0 <4.9.0'
  # In-app playback for the voice-recording browser in the memory
  # manager. Dialog1 already plays these via HTML5 Audio, but the
  # memory-manager screen is pure Flutter and needs its own player.
  audioplayers: ^6.1.0
  # Notifications feature (spec: docs/superpowers/specs/2026-07-27-notifications-design.md).
  # timezone: waking-hour arithmetic must be DST-correct and testable against a
  # pinned zone — bare DateTime resolves against the host machine.
  # flutter_timezone: device IANA zone name to seed tz.local.
  # Pinned >=3.0.1 (not the originally-planned ^2.1.0): 2.1.0's Android side
  # still references the v1-embedding PluginRegistry.Registrar shim, which
  # Flutter's engine jar has fully removed as of this SDK (build fails with
  # "Unresolved reference 'Registrar'"). 3.0.1 dropped v1-embedding support
  # and is otherwise the same Dart API (Future<String> getLocalTimezone()),
  # so this is a build-fix bump, not a behavior change.
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # Delivery layer (Plan 2). flutter_local_notifications: pre-armed OS alarms
  # + offline action buttons on Android/iOS/macOS/Linux. workmanager: Android
  # periodic safety net (rearm + sweep) — spec §Delivery.
  flutter_local_notifications: ^18.0.1
  # Pinned >=0.6.0 (not the originally-planned ^0.5.2): 0.5.2's Android side
  # still references v1-embedding shims (ShimPluginRegistry,
  # PluginRegistrantCallback, PluginRegistry.Registrar) that this Flutter
  # SDK's engine jar no longer ships (build fails with "Unresolved
  # reference"). 0.6.0's changelog: "Removed V1 plugin APIs - this is now a
  # Android V2 plugin only"; the Dart API (Workmanager(), initialize(),
  # registerPeriodicTask(), ExistingWorkPolicy) is unchanged.
  workmanager: ^0.6.0
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # In-memory SQLite so NotifDao and the v6→v7 migration are unit-testable
  # without a device (CupitorDb itself needs path_provider).
  sqflite_common_ffi: ^2.3.3

  # Direct dev-dep (used by notif_timer_test) rather than leaning on
  # flutter_test's transitive copy.
  fake_async: ^1.3.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/js/utils.js
    - assets/js/sentence_tag.js
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
