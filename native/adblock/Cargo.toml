[package]
name = "cupitor_adblock"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
adblock = { version = "=0.13.6", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling", "content-blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
base64 = "0.23"
flate2 = "1"

[profile.release]
lto = "thin"
opt-level = "s"
strip = "debuginfo"

