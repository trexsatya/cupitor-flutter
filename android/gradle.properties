org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# AGP 8.7.3 was tested up to compileSdk 35; we compile against 36 because
# Google Play requires new releases to target API 36. Silences the warning
# AGP prints for that combination. Drop this once AGP is 8.11+.
android.suppressUnsupportedCompileSdk=36
