name: Verify macOS
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build macos --debug
      - name: Verify native WebView and recording behavior
        run: xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
