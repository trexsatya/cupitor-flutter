name: Build and deploy Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build app bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.package.outputs.version }}
      build_number: ${{ steps.package.outputs.build_number }}
      artifact: ${{ steps.package.outputs.artifact }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free hosted runner disk space
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          # Unused toolchains and the image's multi-version Android SDK consume
          # the space needed by Gradle, native libraries and Robolectric SDKs.
          # setup-android below installs the pinned packages into ANDROID_HOME.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk
          cupitor_sdk_root="$RUNNER_TEMP/android-sdk"
          {
            printf 'ANDROID_HOME=%s\n' "$cupitor_sdk_root"
            printf 'ANDROID_SDK_ROOT=%s\n' "$cupitor_sdk_root"
            printf 'ANDROID_NDK=%s/ndk/27.0.12077973\n' "$cupitor_sdk_root"
            printf 'ANDROID_NDK_HOME=%s/ndk/27.0.12077973\n' "$cupitor_sdk_root"
            printf 'ANDROID_NDK_ROOT=%s/ndk/27.0.12077973\n' "$cupitor_sdk_root"
            printf 'ANDROID_NDK_LATEST_HOME=%s/ndk/27.0.12077973\n' "$cupitor_sdk_root"
          } >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1
          log-accepted-android-sdk-licenses: false

      - name: Install test dependencies and configure Gradle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'PROPERTIES'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
          org.gradle.workers.max=2
          PROPERTIES

      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Flutter tests
        run: flutter test

      - name: Run reader JavaScript tests
        # The lookup/video integration harness needs a separate website checkout
        # and jsdom. This reader test is self-contained in the Flutter repo.
        run: node --test test/js/reader_selection.test.mjs

      # PRs and manual runs on other branches never receive signing secrets.
      - name: Configure release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: python
        run: |
          import base64
          import os
          from pathlib import Path

          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD',
                   'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          configured = [bool(os.environ.get(name)) for name in names]
          if any(configured) and not all(configured):
              raise SystemExit('Set all four Android signing secrets, or leave all four unset.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'signed={str(all(configured)).lower()}\n')
          if not all(configured):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Signing secrets are unset: a debug-signed test AAB will be available '
                                'in Artifacts. GitHub Release publication is disabled.\n')
              raise SystemExit(0)

          # Properties.load reads ISO-8859-1 and interprets backslash escapes.
          # Encode every character to preserve spaces, Unicode and punctuation.
          def property_value(value):
              encoded = value.encode('utf-16-be')
              return ''.join('\\u' + encoded[i:i + 2].hex() for i in range(0, len(encoded), 2))

          keystore = Path(os.environ['RUNNER_TEMP']) / 'cupitor-release.jks'
          keystore.write_bytes(base64.b64decode(''.join(os.environ[names[0]].split()), validate=True))
          keystore.chmod(0o600)
          properties = {
              'storeFile': str(keystore),
              'storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'],
              'keyAlias': os.environ['ANDROID_KEY_ALIAS'],
              'keyPassword': os.environ['ANDROID_KEY_PASSWORD'],
          }
          path = Path('android/key.properties')
          path.write_text(''.join(key + '=' + property_value(value) + '\n'
                                  for key, value in properties.items()), encoding='ascii')
          path.chmod(0o600)

      - name: Prepare app bundle metadata
        id: package
        env:
          SIGNING: ${{ steps.signing.outputs.signed == 'true' && 'release' || 'test' }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          match = re.search(r'^version:\s*(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\+(\d+)\s*$',
                            Path('pubspec.yaml').read_text(), re.MULTILINE)
          if not match:
              raise SystemExit('Expected version: major.minor.patch+build in pubspec.yaml')
          version, base = match.groups()
          build_number = int(base) + int(os.environ['GITHUB_RUN_NUMBER'])
          if not 0 < build_number < 2100000000:
              raise SystemExit('Android build number is out of range')
          artifact = f"cupitor-android-{os.environ['GITHUB_RUN_NUMBER']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          filename = f"cupitor-{version}-{build_number}-{os.environ['SIGNING']}.aab"
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nbuild_number={build_number}\nartifact={artifact}\nfilename={filename}\n')

      - name: Check build disk space
        shell: bash
        run: |
          df -h "$GITHUB_WORKSPACE"
          available_kib=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if (( available_kib < 12 * 1024 * 1024 )); then
            echo '::error::At least 12 GiB of free disk space is required for the Android build and tests.'
            exit 1
          fi

      - name: Build release-mode app bundle
        env:
          BUILD_NUMBER: ${{ steps.package.outputs.build_number }}
        run: flutter build appbundle --release --build-number "$BUILD_NUMBER"

      # flutter build generates the gitignored wrapper and local.properties.
      - name: Run Android unit tests
        id: android_tests
        working-directory: android
        run: |
          df -h "$GITHUB_WORKSPACE"
          ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Upload Android test failure reports
        if: failure() && steps.android_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/app/reports/tests/testReleaseUnitTest/
            build/app/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Collect app bundle
        env:
          BUNDLE_FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/$BUNDLE_FILENAME"

      - name: Upload downloadable app bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Link app bundle in run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf '[Download Android app bundle](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/cupitor-release.jks"

  deploy:
    name: Publish signed Android release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested app bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
        shell: bash
        run: |
          tag="android-$GITHUB_RUN_NUMBER"
          printf 'Android App Bundle for Cupitor %s (build %s).\n\nSource: %s\n' \
            "$VERSION" "$BUILD_NUMBER" "$GITHUB_SHA" > release-notes.md
          if gh release view "$tag" --json isDraft > existing-release.json 2>/dev/null; then
            # Re-running a published build does not replace immutable assets.
            if python -c 'import json,sys; sys.exit(not json.load(open("existing-release.json"))["isDraft"])'; then
              gh release upload "$tag" dist/*.aab --clobber
              gh release edit "$tag" --draft=false --latest
            fi
          else
            gh release create "$tag" dist/*.aab --target "$GITHUB_SHA" \
              --title "Cupitor Android $VERSION ($BUILD_NUMBER)" \
              --notes-file release-notes.md --latest
          fi
          gh release view "$tag" --json url --jq '"[Download signed Android release](" + .url + ")"' >> "$GITHUB_STEP_SUMMARY"
